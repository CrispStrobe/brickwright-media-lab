name: verify

# Boots every media-lab project that can be run deterministically on a pinned
# bw-board checkout and checks its manifest's expect[] against the real console
# transcript. Projects that need external media, an OS image, or interactive
# input are skipped loudly, by name (see scripts/ci-verify.mjs).

on:
  push:
    branches: [main]
  pull_request:
  # Nightly drift guard: the fetched projects (prebuilt upstream binaries and
  # GPL/LGPL OS images) are sha-pinned, so if an upstream retags, moves or
  # removes a file, --fetch's sha check turns red here before anyone hits it on
  # a push. Catches the class of breakage the lite gallery saw (a pinned source
  # drifting out from under the committed pin).
  schedule:
    - cron: '17 4 * * *'   # 04:17 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout media-lab
        uses: actions/checkout@v4
        with:
          path: media-lab

      # bw-board is PUBLIC, so the default GITHUB_TOKEN can clone it. Pinned to a
      # master commit that carries runMediaBundle, run-dos.mjs and the rp2040
      # media-bundle runner. Bump this pin deliberately when a project needs a
      # newer bw-board surface.
      - name: Checkout bw-board (pinned)
        uses: actions/checkout@v4
        with:
          repository: CrispStrobe/bw-board
          ref: 4869e77752e110910ac56520bc1f47a9cded97f4
          path: bw-board

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install bw-board dependencies
        run: npm ci
        working-directory: bw-board

      - name: Build pinned 64tass for reproducible lesson ROMs
        working-directory: media-lab
        run: |
          assembler="$(scripts/prepare-64tass.sh "$RUNNER_TEMP/brickwright-64tass")"
          printf 'TASS64=%s\n' "$assembler" >> "$GITHUB_ENV"

      - name: Reproduce Tali Forth ROM from pinned source
        run: projects/tali-forth-65c02/fetch.sh
        working-directory: media-lab

      - name: Review benchmark manifests, assets and retained evidence
        run: sh projects/x86-benchmarks/review.sh
        working-directory: media-lab

      # --fetch runs each fetch-only project's fetch.sh (sha-verified) so the
      # prebuilt upstream binaries (f83/small-c/volksforth) are exercised too,
      # without this repo re-hosting them. A download that verifies wrong fails.
      - name: Verify bootable projects
        run: node scripts/ci-verify.mjs --fetch
        working-directory: media-lab
        env:
          BW_BOARD_DIR: ${{ github.workspace }}/bw-board

  kim:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: media-lab
      - uses: actions/checkout@v4
        with:
          repository: CrispStrobe/bw-board
          ref: 8f823cbacdf2ea9ce74818151b870892e568d0bd
          path: bw-board
          sparse-checkout: src
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Boot ACE and exercise KIM-1 expansion and storage media
        working-directory: media-lab
        env:
          BW_BOARD_DIR: ${{ github.workspace }}/bw-board
        run: |
          projects/ace-kim/fetch.sh
          node projects/ace-kim/proof.mjs
          node projects/kim1-expansion-demos/proof.mjs
          projects/kim1-cpm65/fetch.sh
          node projects/kim1-cpm65/proof.mjs
